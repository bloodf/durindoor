name: Artifact Smoke
# Manual only: builds standalone and the npm tarball, installs them in isolation
# and runs the installed-artifact smoke. Publishes nothing.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C cli install --frozen-lockfile

      - name: Build standalone
        run: pnpm run build

      - name: Smoke standalone artifact
        run: pnpm run verify:installed "$PWD/.next/standalone/custom-server.js"

      - name: Build and pack CLI
        run: |
          pnpm -C cli run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack ./cli --pack-destination "$RUNNER_TEMP/pack"

      - name: Smoke packed npm artifact
        run: pnpm run verify:packed "$RUNNER_TEMP"/pack/durindoor-*.tgz
