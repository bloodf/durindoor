name: "✅ CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    name: "✨ Lint & Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "📌 Pin npm"
        run: |
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"

      - name: "📦 Install dependencies"
        run: npm ci --no-audit --no-fund

      - name: "🎨 Lint"
        run: npm run lint

      - name: Agent index drift gate
        run: npm run check:agent-index

      - name: Postgres migration registry gate
        run: npm run check:postgres-migrations

      - name: "🏗️ Build (isolated state)"
        env:
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: npm run build

  website-changes:
    name: Website changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      website: ${{ steps.diff.outputs.website }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Pull requests build the website only when docs/ or website/ changed
      # (matching website/scripts/vercel-ignore-build.sh). Pushes to main always
      # build it, which also catches dashboard code the site imports from src/.
      - name: Detect docs/ or website/ changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- docs website; then
            echo "website=false" >> "$GITHUB_OUTPUT"
          else
            echo "website=true" >> "$GITHUB_OUTPUT"
          fi

  website-build:
    name: Website build
    needs: website-changes
    if: needs.website-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install website dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Check docs
        run: npm run check:docs

      - name: Check provider catalog
        run: npm run check:provider-catalog
