name: "✅ CI"

on:
  # Local validation is the ordinary PR path. See internal/docs/local-ci.md.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: "✨ Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🎨 Lint"
        run: pnpm run lint

      - name: Agent index drift gate
        run: pnpm run check:agent-index

      - name: Postgres migration registry gate
        run: pnpm run check:postgres-migrations

      - name: "🏗️ Build (isolated state)"
        env:
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: pnpm run build

  website-build:
    name: Website build
    # An explicit manual CI run always validates the website.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: pnpm run build

      - name: Check docs
        run: pnpm run check:docs

      - name: Check provider catalog
        run: pnpm run check:provider-catalog
