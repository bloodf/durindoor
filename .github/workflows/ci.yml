name: "✅ CI"

on:
  # Local validation is the ordinary PR path. See internal/docs/local-ci.md.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: "✨ Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.18.0
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🎨 Lint"
        run: pnpm run lint

      - name: Agent index drift gate
        run: pnpm run check:agent-index

      - name: Postgres migration registry gate
        run: pnpm run check:postgres-migrations

      - name: "🏗️ Build (isolated state)"
        env:
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: pnpm run build

  website-build:
    name: Website build
    # An explicit manual CI run always validates the website.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.18.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Smoke test website mock
        working-directory: website
        run: pnpm run mock:smoke

      - name: Build website
        working-directory: website
        run: pnpm run build

      - name: Install Chromium
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium

      - name: Run website browser suites
        working-directory: website
        run: pnpm exec playwright test

      - name: Check docs
        run: pnpm run check:docs

      - name: Check provider catalog
        run: pnpm run check:provider-catalog
