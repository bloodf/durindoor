name: "✅ CI"

# Two-branch release model: only `dev` and `main`.
# Scope here: install + lint + build. Tests live in `test.yml` to keep the
# vitest job independent of build regressions.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: "✨ Lint & Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` — repo gitignores package-lock.json (see .gitignore
          # line 63). setup-node v4 throws "Dependencies lock file is not found"
          # if you ask it to cache against a non-existent lockfile.

      - name: "📦 Install dependencies"
        run: npm install --no-audit --no-fund

      # ponytail: lint is scoped to `src/` (DurinDoor-authored) because
      # `open-sse/` re-exports the 9router upstream and would surface its
      # pre-existing lint warnings as CI noise. A separate `lint:all`
      # (not in CI) can later cover the whole tree when we triage the
      # upstream-inherited warnings under `react-hooks/*`.
      - name: "🎨 Lint"
        run: npm run lint

      - name: "🏗️ Build"
        run: npm run build
