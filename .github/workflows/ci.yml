name: "✅ CI"

on:
  # Local validation is the ordinary PR path. See internal/docs/local-ci.md.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    name: "✨ Lint & Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🎨 Lint"
        run: pnpm run lint

      - name: Agent index drift gate
        run: pnpm run check:agent-index

      - name: Postgres migration registry gate
        run: pnpm run check:postgres-migrations

      - name: "🏗️ Build (isolated state)"
        env:
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: pnpm run build

  website-changes:
    name: Website changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      website: ${{ steps.diff.outputs.website }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Pull requests build the website only when docs/ or website/ changed
      # (matching website/scripts/vercel-ignore-build.sh). Pushes to main always
      # build it, which also catches dashboard code the site imports from src/.
      - name: Detect docs/ or website/ changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- docs website; then
            echo "website=false" >> "$GITHUB_OUTPUT"
          else
            echo "website=true" >> "$GITHUB_OUTPUT"
          fi

  website-build:
    name: Website build
    needs: website-changes
    if: needs.website-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: pnpm run build

      - name: Check docs
        run: pnpm run check:docs

      - name: Check provider catalog
        run: pnpm run check:provider-catalog
