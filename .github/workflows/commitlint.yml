name: Commitlint
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Exact base commit SHA (exclusive)"
        required: true
      head:
        description: "Exact head commit SHA (inclusive)"
        required: true
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Pin npm
        run: |
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"

      - name: Install commitlint (versions match wagoid/commitlint-github-action v5.5.1 package.json)
        run: npm install --no-save --no-package-lock --no-audit --no-fund @commitlint/cli@18.6.1 @commitlint/config-conventional@18.6.3

      - name: Lint exact commit range
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          INPUT_BASE: ${{ github.event.inputs.base }}
          INPUT_HEAD: ${{ github.event.inputs.head }}
        run: |
          if [ "$EVENT" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_HEAD"
          else
            BASE="$INPUT_BASE"; HEAD="$INPUT_HEAD"
          fi
          case "$BASE" in ""|0000000000000000000000000000000000000000) echo "missing/zero base; refusing to guess a range" >&2; exit 1;; esac
          BASE="$(git rev-parse --verify "$BASE^{commit}")"
          HEAD="$(git rev-parse --verify "$HEAD^{commit}")"
          echo "commitlint range: $BASE..$HEAD"
          npx --no-install commitlint --config .commitlintrc.cjs --from "$BASE" --to "$HEAD"
