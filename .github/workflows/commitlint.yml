name: Commitlint
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Exact comparison base commit (40 lowercase hex characters)"
        required: true
        type: string
      title:
        description: "PR title used for the squash commit"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install commitlint
        run: |
          test "$(pnpm --version)" = "12.18.0"
          mkdir -p "$RUNNER_TEMP/commitlint"
          cd "$RUNNER_TEMP/commitlint"
          pnpm init
          pnpm add @commitlint/cli@18.6.1 @commitlint/config-conventional@18.6.3
          cp "$GITHUB_WORKSPACE/.commitlintrc.cjs" "$RUNNER_TEMP/commitlint/.commitlintrc.cjs"
      - name: Validate range and squash title
        env:
          BASE_SHA: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.title }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify "$BASE_SHA^{commit}")" = "$BASE_SHA"
          node "$RUNNER_TEMP/commitlint/node_modules/@commitlint/cli/cli.js" --config "$RUNNER_TEMP/commitlint/.commitlintrc.cjs" --cwd "$GITHUB_WORKSPACE" --from "$BASE_SHA" --to HEAD --verbose
          printf '%s\n' "$PR_TITLE" | node "$RUNNER_TEMP/commitlint/node_modules/@commitlint/cli/cli.js" --config "$RUNNER_TEMP/commitlint/.commitlintrc.cjs" --cwd "$GITHUB_WORKSPACE" --verbose
