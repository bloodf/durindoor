name: Commitlint
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Exact comparison base commit (40 lowercase hex characters)"
        required: true
        type: string
      title:
        description: "PR title used for the squash commit"
        required: true
        type: string
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - name: Pin npm and install commitlint
        run: |
          npm install --global npm@11.20.0
          test "$(npm --version)" = "11.20.0"
          npm install --no-save --package-lock=false @commitlint/cli@18.6.1 @commitlint/config-conventional@18.6.3
      - name: Validate range and squash title
        env:
          BASE_SHA: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.title }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify "$BASE_SHA^{commit}")" = "$BASE_SHA"
          node node_modules/@commitlint/cli/cli.js --from "$BASE_SHA" --to HEAD --verbose
          printf '%s\n' "$PR_TITLE" | node node_modules/@commitlint/cli/cli.js --verbose
