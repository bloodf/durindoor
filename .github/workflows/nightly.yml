name: Nightly

# The schedule is disabled in repository settings during dev recovery. When it
# is re-enabled after the zero-test stage, every gate below is blocking and the
# release step cannot run after a failed install, lint, build, or test.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history: the Vitest gate's ported-ledger test scans commit
          # subjects (`port(upstream): #N`) across the whole repo history.
          fetch-depth: 0
          persist-credentials: false

      - name: Pin target commit SHA
        id: pin
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
            tests/pnpm-lock.yaml
            cli/pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Install CLI dependencies
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Install test dependencies
        working-directory: tests
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Agent index drift gate
        run: pnpm run check:agent-index

      - name: Build with isolated application state
        env:
          HOME: ${{ runner.temp }}/durindoor-build-home
          DATA_DIR: ${{ runner.temp }}/durindoor-build-data
        run: mkdir -p "$HOME" "$DATA_DIR" && pnpm run build

      - name: Run blocking Vitest gate
        working-directory: tests
        env:
          BASELINE_BASE_REF: HEAD^
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && pnpm run test:ci

      - name: Verify test reports
        if: always()
        run: |
          test -s tests/.test-results.json
          test -s tests/.test-results.junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.test-results.json
            tests/.test-results.junit.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Check nightly tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-$(date -u +%Y-%m-%d)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today's nightly ${TAG} already published — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish nightly pre-release
        if: ${{ success() && steps.check.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ steps.pin.outputs.head_sha }}
          name: "Nightly ${{ steps.check.outputs.tag }}"
          generate_release_notes: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
