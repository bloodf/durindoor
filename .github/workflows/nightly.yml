name: Nightly

# Two-branch release model:
#   dev   → nightly pre-releases (this workflow, daily)
#   main  → controlled production releases (release.yml on published)
#
# Baselines note: the project's `tests/__baseline__/known-fails.txt` is
# currently stale (~27 pre-existing failures unrelated to current work —
# see migration plan §7/§8). Until that is triaged, the no-regression gate
# runs in advisory mode (`continue-on-error: true`) so that daily cron
# continues to emit nightly pre-releases. Once the baseline is fixed,
# promote the gate to blocking.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          # `persist-credentials: false` keeps the default GITHUB_TOKEN out
          # of .git/config — `contents: write` alone is enough for
          # softprops/action-gh-release to publish a tag/release, and we
          # don't run any further git push from this workflow.
          persist-credentials: false

      - name: Pin target commit SHA
        id: pin
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` — repo gitignores package-lock.json
          # (`.gitignore` ~line 63), and setup-node v4 throws
          # `Dependencies lock file is not found ...` when the cache key
          # requires a lockfile that doesn't exist. Mirrors test.yml pattern.

      # Repo intentionally gitignores package-lock.json, so `npm ci` would
      # fail; use `npm install` instead.
      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      # `continue-on-error: true` here is temporary until the baseline rot
      # (see file header) is triaged. Vitest still emits JSON; the no-
      # regression gate below reads that JSON. We do NOT want a daily
      # silent failure to suppress nightly releases.
      - name: Run vitest suite (JSON)
        continue-on-error: true
        working-directory: tests
        run: npm run test:json || true

      - name: No-regression gate (advisory — see file header)
        continue-on-error: true
        working-directory: tests
        run: npm run gate

      - name: Check nightly tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-$(date -u +%Y-%m-%d)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today's nightly ${TAG} already published — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # softprops/action-gh-release creates the tag implicitly from
      # `tag_name`. `target_commitish` is set to the checked-out SHA so the
      # release is anchored to an immutable commit (not a moving branch
      # ref), and the tag/release survives later `dev` history rewrites.
      - name: Publish nightly pre-release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ steps.pin.outputs.head_sha }}
          name: "Nightly ${{ steps.check.outputs.tag }}"
          generate_release_notes: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
