name: Nightly

# The schedule is disabled in repository settings during dev recovery. When it
# is re-enabled after the zero-test stage, every gate below is blocking and the
# release step cannot run after a failed install, lint, build, or test.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2
          persist-credentials: false

      - name: Pin target commit SHA
        id: pin
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Agent index drift gate
        run: npm run check:agent-index

      - name: Build with isolated application state
        run: npm run build

      - name: Run blocking Vitest gate
        working-directory: tests
        env:
          BASELINE_BASE_REF: HEAD^
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && npm run test:ci

      - name: Verify test reports
        if: always()
        run: |
          test -s tests/.test-results.json
          test -s tests/.test-results.junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.test-results.json
            tests/.test-results.junit.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Check nightly tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-$(date -u +%Y-%m-%d)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today's nightly ${TAG} already published — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish nightly pre-release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ steps.pin.outputs.head_sha }}
          name: "Nightly ${{ steps.check.outputs.tag }}"
          generate_release_notes: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
