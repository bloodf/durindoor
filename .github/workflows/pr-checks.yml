name: "🛡️ PR and main-push checks"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }},
  cancel-in-progress: true

jobs:
  check:
    name: "🔍 Lint and tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: "📦 Install app dependencies"
        run: pnpm install --frozen-lockfile

      - name: "📦 Install test dependencies"
        working-directory: tests
        run: pnpm install --frozen-lockfile

      - name: "🔧 Run lint"
        run: pnpm run lint

      - name: "🧪 Run test:ci"
        working-directory: tests
        env:
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && pnpm run test:ci
