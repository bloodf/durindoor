name: Release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the Vitest gate's ported-ledger test scans commit
          # subjects (`port(upstream): #N`) across the whole repo history.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test dependencies
        working-directory: tests
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Agent index drift gate
        run: pnpm run check:agent-index

      - name: Build with isolated application state
        run: pnpm run build

      - name: Run blocking Vitest gate
        working-directory: tests
        env:
          BASELINE_BASE_REF: HEAD^
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && pnpm run test:ci

      - name: Verify test reports
        if: always()
        run: |
          test -s tests/.test-results.json
          test -s tests/.test-results.junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.test-results.json
            tests/.test-results.junit.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Install CLI dependencies
        run: pnpm -C cli install --frozen-lockfile

      - name: Smoke standalone artifact
        run: pnpm run verify:installed "$PWD/.next/standalone/custom-server.js"

      - name: Build, pack and smoke npm tarball
        run: |
          pnpm -C cli run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack ./cli --pack-destination "$RUNNER_TEMP/pack"
          pnpm run verify:packed "$RUNNER_TEMP"/pack/durindoor-*.tgz

      - name: Publish CLI
        # Publish the exact tarball the smoke installed; tarball publishes run no prepublishOnly rebuild.
        run: npm publish "$RUNNER_TEMP"/pack/durindoor-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
