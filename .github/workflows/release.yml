name: Release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the Vitest gate's ported-ledger test scans commit
          # subjects (`port(upstream): #N`) across the whole repo history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: |
          npm install --global npm@11.20.0
          test "$(npm --version)" = "11.20.0"

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Agent index drift gate
        run: npm run check:agent-index

      - name: Build with isolated application state
        run: npm run build

      - name: Run blocking Vitest gate
        working-directory: tests
        env:
          BASELINE_BASE_REF: HEAD^
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && npm run test:ci

      - name: Verify test reports
        if: always()
        run: |
          test -s tests/.test-results.json
          test -s tests/.test-results.junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.test-results.json
            tests/.test-results.junit.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Install CLI dependencies
        run: npm --prefix cli install --include=dev --no-audit --no-fund

      - name: Smoke standalone artifact
        run: npm run verify:installed -- "$PWD/.next/standalone/custom-server.js"

      - name: Build, pack and smoke npm tarball
        run: |
          npm --prefix cli run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm --prefix cli pack --pack-destination "$RUNNER_TEMP/pack"
          npm run verify:packed -- "$RUNNER_TEMP"/pack/durindoor-*.tgz

      - name: Publish CLI
        # Publish the exact tarball the smoke installed; tarball publishes run no prepublishOnly rebuild.
        run: npm publish "$RUNNER_TEMP"/pack/durindoor-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
