name: Release
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm --prefix cli install --include=dev
      - run: npm run cli:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
