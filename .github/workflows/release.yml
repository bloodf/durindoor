name: Release npm package
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches both package versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$(node -p "require('./package.json').version")" != "$VERSION" ] || [ "$(node -p "require('./cli/package.json').version")" != "$VERSION" ]; then
            echo "::error::Release tag must match both package.json and cli/package.json versions."
            exit 1
          fi
      - name: Download verified npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-npm-tarball
          path: ${{ runner.temp }}/pack
      - name: Publish CLI
        run: npm publish "$RUNNER_TEMP"/pack/durindoor-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
