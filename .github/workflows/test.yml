name: "🧪 Tests"

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Exact comparison base commit (40 lowercase hex characters)"
        required: true
        type: string

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: "🧪 Vitest + No-regression gate"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
            tests/pnpm-lock.yaml
            cli/pnpm-lock.yaml

      - name: Verify pnpm
        run: test "$(pnpm --version)" = "12.18.0"

      - name: "📦 Install app dependencies"
        run: pnpm install --frozen-lockfile

      - name: "📦 Install website dependencies"
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: "📦 Install CLI dependencies"
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: "📦 Install test dependencies"
        working-directory: tests
        run: pnpm install --frozen-lockfile

      - name: Select baseline comparison ref
        env:
          BASE_SHA: ${{ inputs.base }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify "$BASE_SHA^{commit}")" = "$BASE_SHA"
          echo "BASELINE_BASE_REF=$BASE_SHA" >> "$GITHUB_ENV"

      - name: "🧪 Run Vitest + fail-closed no-regression gate"
        working-directory: tests
        env:
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && pnpm run test:ci

      - name: Verify test reports
        if: always()
        run: |
          test -s tests/.test-results.json
          test -s tests/.test-results.junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.test-results.json
            tests/.test-results.junit.xml
          include-hidden-files: true
          if-no-files-found: error
