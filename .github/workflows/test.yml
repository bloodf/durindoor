name: "🧪 Tests"

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    name: "🧪 Vitest + No-regression gate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: "📌 Pin npm"
        run: |
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"

      - name: "📦 Install app dependencies"
        run: npm ci --no-audit --no-fund

      - name: "📦 Install test dependencies"
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Select baseline comparison ref
        run: echo "BASELINE_BASE_REF=${{ github.event.pull_request.base.sha || github.event.before }}" >> "$GITHUB_ENV"

      - name: "🧪 Run Vitest + fail-closed no-regression gate"
        working-directory: tests
        env:
          HOME: ${{ runner.temp }}/durindoor-home
          DATA_DIR: ${{ runner.temp }}/durindoor-data
        run: mkdir -p "$HOME" "$DATA_DIR" && npm run test:ci

      - name: Verify test reports
        if: always()
        run: |
          test -s tests/.test-results.json
          test -s tests/.test-results.junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.test-results.json
            tests/.test-results.junit.xml
          include-hidden-files: true
          if-no-files-found: error
