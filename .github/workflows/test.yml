name: "🧪 Tests"

# Two-branch release model: only `dev` and `main`.
# This workflow runs the vitest suite and the no-regression gate. The
# gate compares the JSON output against `tests/__baseline__/known-fails.txt`
# so a curated set of known drifts is tolerated — the real signal is
# "did THIS commit introduce a NEW pass→fail regression?".

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: "🧪 Vitest + No-regression gate"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # The repo intentionally does not commit a package-lock.json (it is
      # gitignored), so there is no lockfile for `npm ci` or setup-node's
      # `cache: npm` to key on — hence plain `npm install` and no cache.
      # Root deps power the code under test (open-sse, src) and the native
      # better-sqlite3 driver used by the DB concurrency tests.
      - name: "📦 Install app dependencies"
        run: npm install --no-audit --no-fund

      - name: "📦 Install test dependencies"
        working-directory: tests
        run: npm install --no-audit --no-fund

      # Run via `npm run test:ci` (= `test:json` then `gate`).
      # Vitest exits non-zero because the suite has real failures
      # (intentional drift from the upstream-9router rebrand). The gate
      # then reads `.test-results.json` and exits 0 only when every
      # failure is already listed in `tests/__baseline__/known-fails.txt`.
      # That is the real CI signal — "did THIS commit introduce a NEW
      # pass→fail regression?"
      - name: "🧪 Run vitest + no-regression gate"
        working-directory: tests
        run: npm run test:ci
