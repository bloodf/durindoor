<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" width="1920" height="520" font-family="'Liberation Serif', 'Times New Roman', Times, serif">
  <defs>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#10e882" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#10e882" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title: Durin Door -->
  <text x="960" y="180" text-anchor="middle"
        font-size="170" font-weight="bold" fill="#f5f5f5"
        filter="url(#softGlow)">Durin Door</text>

  <!-- Decorative diamond divider -->
  <g transform="translate(960, 250)">
    <line x1="-180" y1="0" x2="-30" y2="0" stroke="#10e882" stroke-opacity="0.8" stroke-width="2"/>
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#10e882" fill-opacity="0.9"/>
    <line x1="30" y1="0" x2="180" y2="0" stroke="#10e882" stroke-opacity="0.8" stroke-width="2"/>
  </g>

  <!-- Subtitle: Speak, friend, and enter -->
  <text x="960" y="340" text-anchor="middle"
        font-size="58" font-style="italic" fill="#dce8dc"
        filter="url(#emeraldGlow)">Speak, friend, and enter</text>

  <!-- Tagline -->
  <text x="960" y="430" text-anchor="middle"
        font-family="'Liberation Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="42" fill="#c8d7d2" fill-opacity="0.85">
    <tspan font-weight="bold">One guarded gateway</tspan>
    <tspan font-weight="normal"> for every AI provider</tspan>
  </text>
</svg>
