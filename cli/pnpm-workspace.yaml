# pnpm 12 settings for the published CLI project. This package is still
# published to and consumed from npm; pnpm is only the repo dev installer here.
# allowBuilds: filled only from real `pnpm ignored-builds` output, per package,
# with justification in the PR body. Never bulk-approve.

# esbuild 0.25.12 postinstall selects the native CLI bundler executable.
allowBuilds:
  esbuild: true

# GHSA-g3hv-75wg-m249: nodemon uses the retained named minimatch function.
# Keep this compatibility exception scoped to the reviewed parent, never global.
overrides:
  'nodemon@3.1.14>minimatch': 11.0.1
