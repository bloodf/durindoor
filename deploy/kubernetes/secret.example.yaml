# EXAMPLE ONLY. Do not commit real values. Create the Secret instead with:
#   kubectl -n durindoor create secret generic durindoor-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=API_KEY_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=INITIAL_PASSWORD='<your password>'
# Optional PostgreSQL engine (fresh direct-Postgres installs only):
#     --from-literal=DURINDOOR_PG_URL='postgres://user:pass@host:5432/durindoor'
# Keep these values stable across upgrades; regenerating them invalidates
# sessions and API keys.
apiVersion: v1
kind: Secret
metadata:
  name: durindoor-secrets
type: Opaque
stringData:
  JWT_SECRET: "<openssl rand -hex 32>"
  API_KEY_SECRET: "<openssl rand -hex 32>"
  INITIAL_PASSWORD: "<your password>"
