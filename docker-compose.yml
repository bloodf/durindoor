services:
  durindoor:
    image: decolua/durindoor:latest
    container_name: durindoor
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - durindoor-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      NODE_OPTIONS: "--max-old-space-size=6144"
    mem_limit: 8g
    cpus: 4
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:20128/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  durindoor-data:
    name: durindoor-data
