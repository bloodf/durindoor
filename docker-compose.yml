services:
  durindoor:
    # Bump this tag to the current published DurinDoor release.
    image: ghcr.io/bloodf/durindoor:4.9.2
    container_name: durindoor
    restart: always
    read_only: true
    cap_drop:
      - ALL
    # The root entrypoint needs these capabilities before it drops to node.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    ports:
      # Keep the app private by default; route a reverse proxy to this port.
      - "127.0.0.1:20128:20128"
    volumes:
      - durindoor-data:/app/data
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/api/livez || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Existing SQLite installs: leave PG_URL unset or empty, run cutover
      # in Settings > Database, then optionally set an explicit boot URL.
      # Fresh direct-Postgres installs: set DURINDOOR_PG_URL before boot.
      # A nonempty URL selects Postgres before SQLite settings load.
      # Empty values are normalized to unset; dashboard credentials live
      # in /app/data/durindoor-secrets.json (mode 0600).
      DURINDOOR_PG_URL: ${DURINDOOR_PG_URL:-}
      DURINDOOR_PG_SSLMODE: ${DURINDOOR_PG_SSLMODE:-prefer}
      DURINDOOR_PG_PREFERRED_VERSION: ${DURINDOOR_PG_PREFERRED_VERSION:-18}

volumes:
  durindoor-data:
    name: durindoor-data
