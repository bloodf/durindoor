services:
  durindoor:
    image: ghcr.io/bloodf/durindoor:latest
    container_name: durindoor
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - durindoor-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production

volumes:
  durindoor-data:
    name: durindoor-data
