# pnpm 12 settings for the root app project. Security floors previously held in
# npm's package.json "overrides" (which pnpm does not read) live here so they
# bind during resolution. They must be in place BEFORE `pnpm import` or any
# resolution run, or floors silently lapse.
overrides:
  dompurify: 3.4.17
  sharp: ^0.35.5
  nanoid@<3.3.18: 3.3.18
  js-yaml@<4.3.2: 4.3.2
  ip-address: ^10.7.4
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  postcss: ^8.5.28
  undici: ^7.30.1
# Reviewed from pnpm ignored-builds on macOS arm64 with Node 24.22.2.
allowBuilds:
  better-sqlite3: true # Native SQLite binding used by the preferred database driver.
  esbuild: true # Platform bundler binary required by app and CLI builds.
  koffi: true # Native FFI backend required by tls-client-node.
  tls-client-node: true # Production TLS transport native library provisioning.
  unrs-resolver: true # Native import resolver used by the lint toolchain.
