# pnpm 12 settings for the website project. Floor previously held in npm's
# package.json "overrides"; must exist BEFORE `pnpm import` or resolution.
overrides:
  dompurify: 3.4.17
# npm's website/.npmrc set legacy-peer-deps=true; pnpm ignores that file.
# This is the explicit pnpm peer-resolution decision for the migration.
strictPeerDependencies: false
# allowBuilds: filled only from real `pnpm ignored-builds` output, per package,
# with justification in the PR body. Never bulk-approve.

# Observed esbuild 0.28.2 postinstall selects the MDX/toolchain native bundler.
allowBuilds:
  esbuild: true
